# Lädt den Ordner site/ bei jeder Änderung auf main per SFTP auf das IONOS Webhosting Pro.
# Benötigt das Repository-Secret SFTP_PASSWORD (Passwort des SFTP-Benutzers unten).
name: Auf IONOS veröffentlichen

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SFTP_HOST: home605531364.1and1-data.host
      SFTP_USER: acc440118376
    steps:
      - uses: actions/checkout@v4

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Hochladen
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          if [ -z "$SFTP_PASSWORD" ]; then echo "::error::Secret SFTP_PASSWORD fehlt"; exit 1; fi
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            mirror --reverse --delete --parallel=4 --verbose=1 site/ ./;
            bye"
